pcm.pi3twe_rx_shared {
    type dsnoop
    ipc_key 723156
    ipc_key_add_uid false
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "hw:CARD=Generic,DEV=0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
    bindings { 0 0 1 1 }
}
pcm.pi3twe_rx {
    type plug
    slave.pcm "pi3twe_rx_shared"
}
